<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json" />
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
  }
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>K & J's Homepage 🏡</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 font-size=%2290%22>&#x1F3E1;</svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

  :root {
    --bg: #FFF8F0;
    --card: #FFFFFF;
    --ink: #3A2E2C;
    --ink-soft: #8A7B72;
    --line: #F1E4D6;
    --breast: #FF8A73;
    --breast-soft: #FFE7E0;
    --pumping: #6C7FE3;
    --pumping-soft: #E4E7FC;
    --mint: #3FBF9E;
    --mint-soft: #DFF6EF;
    --formula: #FFB238;
    --formula-soft: #FFF1D6;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    background: var(--bg);
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--ink);
  }
  .heading { font-family: 'Baloo 2', 'Nunito', sans-serif; }
  
  #dashboard {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px 16px 80px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .dash-header {
    background: linear-gradient(135deg, var(--breast-soft), var(--pumping-soft));
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 24px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.03);
  }
  .dash-title { font-size: 26px; font-weight: 800; margin: 0; }
  .dash-subtitle { font-size: 13px; color: var(--ink-soft); font-weight: 700; margin-top: 4px; }
  
  .gear-btn {
    background: var(--card); border: 1px solid var(--line); border-radius: 50%;
    width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }

  .app-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .app-launcher {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 12px 6px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 6px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .launcher-icon { font-size: 24px; }
  .launcher-label { font-size: 11px; font-weight: 800; color: var(--ink-soft); text-align: center; }

  .card {
    background: var(--card); border-radius: 22px; padding: 18px;
    border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .card-title { font-size: 16px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

  .quick-list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
  #eventsPreview, #tasksPreview { cursor: pointer; }
  .list-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; background: var(--bg); border-radius: 12px;
    font-size: 13.5px; font-weight: 700;
  }
  .item-meta { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  .todo-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 20px; }
  .status-todo { background: var(--formula-soft); color: #B27300; }
  .status-progress { background: var(--pumping-soft); color: var(--pumping); }

  .wish-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .wish-item-card {
    flex: 0 0 140px; background: var(--bg); border-radius: 14px; padding: 10px;
    font-size: 12px; border: 1.5px solid var(--line);
  }
  .wish-link { color: var(--pumping); text-decoration: none; font-weight: 700; display: inline-block; margin-top: 6px; }

  .research-item {
    background: var(--bg); border-radius: 14px; padding: 12px; margin-top: 10px; cursor: pointer;
  }
  .research-item:first-child { margin-top: 0; }
  .research-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .research-title { font-weight: 800; font-size: 13.5px; }
  .research-updated { font-size: 11px; color: var(--ink-soft); font-weight: 700; white-space: nowrap; flex-shrink: 0; }
  .research-preview { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; line-height: 1.4; }
  .research-link-chip {
    display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 11.5px; font-weight: 700;
    color: var(--pumping); background: var(--pumping-soft); padding: 4px 9px; border-radius: 999px; text-decoration: none;
  }

  .app-modal {
    position: fixed; inset: 0; background: var(--bg); z-index: 100;
    display: none; flex-direction: column;
    animation: slideUp 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.94) forwards;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .app-iframe { width: 100%; flex: 1; border: none; }

  .settings-overlay {
    position: fixed; inset: 0; background: rgba(58,46,44,0.45); z-index: 101;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .settings-card { background: var(--card); border-radius: 24px; padding: 20px; width: 100%; max-width: 400px; }
  textarea {
    width: 100%; height: 120px; font-family: monospace; font-size: 11px;
    padding: 8px; border-radius: 12px; border: 1.5px solid var(--line); margin-top: 8px;
  }
  .save-btn {
    background: var(--mint); color: white; border: none; font-weight: 800;
    width: 100%; padding: 12px; border-radius: 12px; margin-top: 12px; cursor: pointer;
  }

  .login-input {
    width: 100%; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line);
    margin-top: 8px; font-size: 14px; font-family: inherit; background: var(--bg); color: var(--ink);
  }
  .login-error {
    color: var(--breast); font-size: 12px; font-weight: 700; margin-top: 8px; min-height: 14px;
  }
  .logout-btn {
    background: transparent; color: var(--ink-soft); border: 1.5px solid var(--line); font-weight: 800;
    width: 100%; padding: 10px; border-radius: 12px; margin-top: 8px; cursor: pointer; font-size: 13px;
  }
</style>
</head>
<body>

<div id="dashboard" style="display:none;">
  
  <div class="dash-header">
    <div>
      <h1 class="dash-title heading">🏡 K & J's Homepage</h1>
      <div class="dash-subtitle">Our Shared Command Center & House Vault</div>
    </div>
    <button class="gear-btn" onclick="openSettings()">⚙️</button>
  </div>

  <div class="app-grid">
    <div class="app-launcher" onclick="launchApp('./baby-feeding-tracker.html', 'Little Log')">
      <span class="launcher-icon">🍼</span>
      <span class="launcher-label heading">Little Log</span>
    </div>
    <div class="app-launcher" onclick="launchApp('./notes.html', 'Shared Notebooks')">
      <span class="launcher-icon">📝</span>
      <span class="launcher-label heading">Notebooks</span>
    </div>
    <div class="app-launcher" onclick="launchApp('./calendar.html', 'Shared Calendar')">
      <span class="launcher-icon">📅</span>
      <span class="launcher-label heading">Calendar</span>
    </div>
    <div class="app-launcher" onclick="launchApp('./tasks.html', 'Active Tasks')">
      <span class="launcher-icon">📋</span>
      <span class="launcher-label heading">Active Tasks</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title heading">📅 Upcoming Events</div>
    <ul class="quick-list" id="eventsPreview">
      <li class="list-item"><span class="item-meta">Loading…</span></li>
    </ul>
  </div>

  <div class="card">
    <div class="card-title heading">📋 Active Tasks</div>
    <ul class="quick-list" id="tasksPreview">
      <li class="list-item"><span class="item-meta">Loading…</span></li>
    </ul>
  </div>

  <div class="card">
    <div class="card-title heading">🔬 Research in Progress</div>
    <div id="researchPreview">
      <div class="item-meta">Loading…</div>
    </div>
  </div>

</div>

<div id="appModal" class="app-modal">
  <iframe id="appIframe" class="app-iframe" src="" allow="microphone; camera"></iframe>
</div>

<div id="settingsOverlay" class="settings-overlay" onclick="closeSettings()">
  <div class="settings-card" onclick="event.stopPropagation()">
    <h3 class="heading" style="margin-top:0;">🏡 Shared DB Connection</h3>
    <div class="dash-subtitle" id="settingsHint" style="margin-bottom:4px;"></div>
    <textarea id="configInput" placeholder='Paste Firebase config object...'></textarea>
    <button class="save-btn" onclick="saveSettings()">Apply Configuration</button>
    <button class="logout-btn" onclick="handleLogout()">Sign Out</button>
  </div>
</div>

<div id="loginOverlay" class="settings-overlay" style="display:none;">
  <div class="settings-card" onclick="event.stopPropagation()">
    <h3 class="heading" style="margin-top:0;">🔒 Sign In</h3>
    <div class="dash-subtitle" style="margin-bottom:4px;">K &amp; J's Homepage — sign in to continue</div>
    <input id="loginEmail" type="email" class="login-input" placeholder="Email" autocomplete="username" />
    <input id="loginPassword" type="password" class="login-input" placeholder="Password" autocomplete="current-password"
      onkeydown="if(event.key === 'Enter') handleLogin()" />
    <div id="loginError" class="login-error"></div>
    <button class="save-btn" onclick="handleLogin()">Sign In</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
  // Firebase config now lives ONLY in localStorage (per-device), never in source.
  // Set it once per device via the Settings (gear icon) modal.
  function loadSavedConfig() {
    const local = localStorage.getItem("parentPlannerFirebaseConfig");
    if (local) {
      try { return JSON.parse(local); } catch(e) {}
    }
    return null;
  }

  function launchApp(url, name) {
    const config = loadSavedConfig();
    const modal = document.getElementById("appModal");
    const iframe = document.getElementById("appIframe");
    
    // Save state to survive page refreshes
    sessionStorage.setItem("activeAppUrl", url);
    sessionStorage.setItem("activeAppName", name);
    
    iframe.src = url;
    modal.style.display = "flex";

    iframe.onload = function() {
      iframe.contentWindow.postMessage({
        type: "SYNC_FIREBASE_CONFIG",
        config: config
      }, "*");
    };
  }

  window.addEventListener("message", function(event) {
    if (event.data && event.data.type === "GO_HOME") {
      const modal = document.getElementById("appModal");
      const iframe = document.getElementById("appIframe");
      iframe.src = "";
      modal.style.display = "none";
      sessionStorage.removeItem("activeAppUrl");
      sessionStorage.removeItem("activeAppName");
    }
  });

  // Check state on fresh load / page refresh
  window.addEventListener("DOMContentLoaded", () => {
    const savedUrl = sessionStorage.getItem("activeAppUrl");
    const savedName = sessionStorage.getItem("activeAppName");
    if (savedUrl && savedName) {
      launchApp(savedUrl, savedName);
    }
  });

  function openSettings() {
    const config = loadSavedConfig();
    document.getElementById("configInput").value = config ? JSON.stringify(config, null, 2) : "";
    document.getElementById("settingsHint").textContent = config
      ? "Paste a new config to switch projects."
      : "Welcome! Paste your Firebase config below to connect this device.";
    document.getElementById("settingsOverlay").style.display = "flex";
  }

  function closeSettings() {
    // Can't dismiss the modal until a config has actually been saved.
    if (!loadSavedConfig()) return;
    document.getElementById("settingsOverlay").style.display = "none";
  }

  function saveSettings() {
    const val = document.getElementById("configInput").value;
    try {
      const obj = JSON.parse(val);
      localStorage.setItem("parentPlannerFirebaseConfig", JSON.stringify(obj));
      document.getElementById("settingsOverlay").style.display = "none";
      alert("Configuration Saved!");
      initFirebase();
    } catch(e) {
      alert("Format error. Please verify your brackets and quotes.");
    }
  }

  // --- Auth ---
  function initFirebase() {
    const config = loadSavedConfig();
    if (!config) {
      // First run on this device: force the settings modal open until a config is saved.
      openSettings();
      return;
    }
    if (!firebase.apps.length) {
      firebase.initializeApp(config);
    }
    setupAuthListener();
  }

  function setupAuthListener() {
    firebase.auth().onAuthStateChanged(function(user) {
      const dashboard = document.getElementById("dashboard");
      const loginOverlay = document.getElementById("loginOverlay");
      if (user) {
        loginOverlay.style.display = "none";
        dashboard.style.display = "flex";
        initDashboardPreviews();
      } else {
        loginOverlay.style.display = "flex";
        dashboard.style.display = "none";
      }
    });
  }

  function handleLogin() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const errEl = document.getElementById("loginError");
    errEl.textContent = "";
    if (!email || !password) {
      errEl.textContent = "Enter both email and password.";
      return;
    }
    firebase.auth().signInWithEmailAndPassword(email, password)
      .catch(err => { errEl.textContent = "Sign-in failed: " + err.message; });
  }

  function handleLogout() {
    firebase.auth().signOut();
    if (loadSavedConfig()) {
      document.getElementById("settingsOverlay").style.display = "none";
    }
  }

  // --- Dashboard live previews (read-only) ---
  function esc(s) {
    return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function timeAgo(ms) {
    if (!ms) return "";
    const diff = Date.now() - ms;
    const min = 60000, hr = min * 60, day = hr * 24;
    if (diff < min) return "just now";
    if (diff < hr) return Math.floor(diff / min) + "m ago";
    if (diff < day) return Math.floor(diff / hr) + "h ago";
    if (diff < day * 30) return Math.floor(diff / day) + "d ago";
    return new Date(ms).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  }

  function plainTextPreview(html, maxLen) {
    maxLen = maxLen || 130;
    const tmp = document.createElement("div");
    tmp.innerHTML = html || "";
    const text = tmp.textContent.replace(/\s+/g, " ").trim();
    if (!text) return "";
    if (text.length <= maxLen) return text;
    return "…" + text.slice(-maxLen);
  }

  function lastLinkInfo(html) {
    const tmp = document.createElement("div");
    tmp.innerHTML = html || "";
    const links = tmp.querySelectorAll("a[href]");
    if (!links.length) return null;
    const last = links[links.length - 1];
    return { href: last.getAttribute("href"), text: (last.textContent || last.getAttribute("href")).trim() };
  }

  function initDashboardPreviews() {
    try {
      const db = firebase.database();

      db.ref("events").on("value", snapshot => {
        const events = snapshot.val() || {};
        const today = todayStr();
        const upcoming = Object.values(events)
          .filter(e => e.date >= today)
          .sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")))
          .slice(0, 3);
        const list = document.getElementById("eventsPreview");
        if (!upcoming.length) {
          list.innerHTML = `<li class="list-item"><span class="item-meta">Nothing scheduled yet</span></li>`;
          return;
        }
        list.innerHTML = upcoming.map(e => {
          const d = new Date(e.date + "T00:00:00");
          const dateLabel = d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + (e.time ? `, ${e.time}` : "");
          return `<li class="list-item">
            <div><b>${esc(e.title || "Untitled")}</b>${e.location ? `<div class="item-meta">${esc(e.location)}</div>` : ""}</div>
            <span style="font-size:12px; font-weight: 800; color:var(--breast);">${esc(dateLabel)}</span>
          </li>`;
        }).join("");
        list.onclick = () => launchApp("./calendar.html", "Shared Calendar");
      });

      db.ref("tasks").on("value", snapshot => {
        const tasks = snapshot.val() || {};
        const today = todayStr();
        const active = Object.values(tasks)
          .filter(t => t.status !== "done")
          .sort((a, b) => (a.dueDate || "9999").localeCompare(b.dueDate || "9999"))
          .slice(0, 3);
        const list = document.getElementById("tasksPreview");
        if (!active.length) {
          list.innerHTML = `<li class="list-item"><span class="item-meta">No active tasks</span></li>`;
          return;
        }
        list.innerHTML = active.map(t => {
          const overdue = t.dueDate && t.dueDate < today;
          const dueLabel = t.dueDate ? new Date(t.dueDate + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "No due date";
          const badgeClass = t.status === "progress" ? "status-progress" : "status-todo";
          const badgeText = t.status === "progress" ? "In Progress" : "To Do";
          return `<li class="list-item">
            <div><b>${esc(t.title || "Untitled")}</b><div class="item-meta">${overdue ? "⚠ Overdue: " : "Due: "}${esc(dueLabel)}</div></div>
            <span class="todo-badge ${badgeClass}">${badgeText}</span>
          </li>`;
        }).join("");
        list.onclick = () => launchApp("./tasks.html", "Active Tasks");
      });

      db.ref("notebooks").on("value", snapshot => {
        const notebooks = snapshot.val() || {};
        const starred = Object.entries(notebooks)
          .filter(([id, nb]) => nb.starred)
          .sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0));
        const container = document.getElementById("researchPreview");
        if (!starred.length) {
          container.innerHTML = `<div class="item-meta">Star a note in Notebooks to pin your in-progress research here.</div>`;
          return;
        }
        container.innerHTML = starred.map(([id, nb]) => {
          const link = lastLinkInfo(nb.content);
          const preview = plainTextPreview(nb.content);
          return `
            <div class="research-item" onclick="launchApp('./notes.html?open=${id}', 'Shared Notebooks')">
              <div class="research-top">
                <div class="research-title">⭐ ${esc(nb.title || "Untitled")}</div>
                <div class="research-updated">${esc(timeAgo(nb.updatedAt))}</div>
              </div>
              ${preview ? `<div class="research-preview">${esc(preview)}</div>` : ""}
              ${link ? `<a href="${esc(link.href)}" target="_blank" class="research-link-chip" onclick="event.stopPropagation()">🔗 ${esc(link.text.length > 30 ? link.text.slice(0, 30) + "…" : link.text)}</a>` : ""}
            </div>`;
        }).join("");
      });
    } catch (e) {
      console.error("Dashboard preview sync failed:", e);
    }
  }

  initFirebase();
</script>
</body>
</html>
